[project]
name = "mai"
version = "1.1.0"
description = "MAI Examples"
authors = [
    {name = "Aleksey Filippov", email = "al.filippov@ulstu.ru"}
]
readme = "readme.md"
requires-python = ">=3.13,<3.14"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
jupyter = "^1.1.1"
numpy = "^2.3.2"
pandas = "^2.3.2"
matplotlib = "^3.10.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
